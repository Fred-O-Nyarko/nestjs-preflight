name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Smoke-test the CLI
        run: |
          node skills/nestjs-preflight/scripts/scan.mjs test/fixtures/good-app --format json > /dev/null
          node skills/nestjs-preflight/scripts/scan.mjs test/fixtures/bad-app --ci > /dev/null && exit 1 || echo "bad-app correctly fails"
