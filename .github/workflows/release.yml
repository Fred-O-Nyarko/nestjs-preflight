name: release
on:
    push:
        tags: ["v*"]
permissions:
    contents: write
jobs:
    skill-zip:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: npm test
            - name: Build the skill zip for Claude apps
              run: cd skills && zip -r ../nestjs-preflight-skill.zip nestjs-preflight
            - uses: softprops/action-gh-release@v2
              with:
                  files: nestjs-preflight-skill.zip
                  generate_release_notes: true
